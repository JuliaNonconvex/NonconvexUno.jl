name: Debug macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the macOS smoke script
        env:
          UNO_TEST_VERBOSE: "true"
        run: julia --startup-file=no --color=yes --check-bounds=yes --depwarn=yes --warn-overwrite=yes --inline=yes --code-coverage=user -e 'using Pkg; Pkg.activate(temp=true); Pkg.develop(path="."); Pkg.add(["JuMP", "UnoSolver", "HSL_jll", "NonconvexCore", "Aqua", "JET"]); include("test/debug_macos.jl")'
