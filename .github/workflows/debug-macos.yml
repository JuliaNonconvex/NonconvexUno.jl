name: Debug macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the macOS smoke script
        run: julia --startup-file=no --color=yes -e 'using Pkg; Pkg.activate(temp=true); Pkg.develop(path="."); Pkg.add("JuMP"); include("test/debug_macos.jl")'
