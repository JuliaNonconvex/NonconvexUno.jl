name: Documentation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Site destination directory (dev, stable, preview/PRnn)'
        required: false
        default: dev
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: "Build documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
        with:
          cache-name: docs
      - name: Install documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build documentation and run examples
        run: julia --project=docs docs/make.jl
      - name: Assemble the site with the previous destinations
        env:
          DEST: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || (github.event_name == 'pull_request' && format('preview/PR{0}', github.event.pull_request.number) || github.event.inputs.destination) || 'dev' }}
        run: |
          git clone --depth=1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/site \
            || { mkdir -p /tmp/site; }
          rm -rf "/tmp/site/$DEST"
          mkdir -p "/tmp/site/$DEST"
          cp -r docs/build/. "/tmp/site/$DEST/"
          touch /tmp/site/.nojekyll
      - name: Persist the destination to gh-pages
        env:
          DEST: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || (github.event_name == 'pull_request' && format('preview/PR{0}', github.event.pull_request.number) || github.event.inputs.destination) || 'dev' }}
        run: |
          git clone --depth=1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/ghp \
            || { mkdir -p /tmp/ghp; cd /tmp/ghp; git init -b gh-pages; }
          cd /tmp/ghp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "/tmp/ghp/$DEST"
          mkdir -p "/tmp/ghp/$DEST"
          cp -r ../site/"$DEST"/. "/tmp/ghp/$DEST/"
          touch /tmp/ghp/.nojekyll
          git add -A
          git diff --cached --quiet || (git commit -m "deploy: $DEST" && git push origin gh-pages)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
  deploy:
    name: "Deploy to GitHub Pages"
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Post preview URL comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            📖 PR preview docs: https://julianonconvex.github.io/NonconvexUno.jl/preview/PR${{ github.event.pull_request.number }}/
          comment_tag: preview-docs
